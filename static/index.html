<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wallpaper Groups</title>
        <link rel="icon" href="favicon.ico" type="image/ico" />
        <link rel="stylesheet" href="styles.css" />
        <script defer src="bundle.js"></script>
    </head>

    <body>
        <header>
            <h1 class="title">Wallpaper Groups</h1>
        </header>
        <div class="output-canvas-div" id="output-canvas-div">
            <canvas class="output-canvas" id="output-canvas"></canvas>
            <div class="tex-region-div">
                <canvas
                    class="tex-region-canvas"
                    id="tex-region-canvas"
                ></canvas>
                <div class="tex-region-settings">
                    <div></div>
                    <button id="load-texture-button">Load texture</button>
                    <div class="group-select-container">
                        <label>Group:</label>
                        <img
                            class="group-select-arrow"
                            id="group-select-prev"
                            src="nav-arrow-left.svg"
                        />
                        <select autocomplete="off" id="group-select"></select>
                        <img
                            class="group-select-arrow"
                            id="group-select-next"
                            src="nav-arrow-right.svg"
                        />
                    </div>
                    <button id="save-wallpaper-button">Save output</button>
                </div>
            </div>
        </div>
    </body>
</html>
