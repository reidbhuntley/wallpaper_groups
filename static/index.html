<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wallpaper Groups</title>
        <link rel="icon" href="favicon.ico" type="image/ico" />
        <link rel="stylesheet" href="styles.css" />
        <script defer src="bundle.js"></script>
    </head>

    <body>
        <header>
            <h1 class="title">Wallpaper Groups</h1>
        </header>
        <div class="output-canvas-div" id="output-canvas-div">
            <canvas class="output-canvas" id="output-canvas"></canvas>
            <div class="tex-region-div">
                <canvas
                    class="tex-region-canvas"
                    id="tex-region-canvas"
                ></canvas>
                <div class="tex-region-settings">
                    <div>
                        <label>Group:</label>
                        <select autocomplete="off" id="group-select">
                            <option value="p1">p1</option>
                            <option value="p2">p2</option>
                            <option value="pm">pm</option>
                            <option value="pg">pg</option>
                            <option value="cm">cm</option>
                            <option value="pmm">pmm</option>
                            <option value="pmg">pmg</option>
                            <option value="pgg">pgg</option>
                            <option value="cmm">cmm</option>
                            <option value="p4">p4</option>
                            <option value="p4m">p4m</option>
                            <option value="p4g">p4g</option>
                            <option value="p3">p3</option>
                            <option value="p3m1">p3m1</option>
                            <option value="p31m">p31m</option>
                            <option value="p6">p6</option>
                            <option value="p6m">p6m</option>
                        </select>
                    </div>
                    <button id="load-texture-button">Load texture</button>
                </div>
            </div>
        </div>
    </body>
</html>
